[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gate-agent"
version = "0.1.0"
description = "VecinoSeguro Raspberry Pi gate-control bridge (Milestone C)."
requires-python = ">=3.9"
dependencies = [
    "supabase==2.9.1",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
]

[project.scripts]
gate-agent = "gate_agent.main:main"

[tool.setuptools.packages.find]
include = ["gate_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
