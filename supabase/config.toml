# VecinoSeguro — local Supabase dev config
# Minimal, standard local-dev setup for `supabase start` / `supabase db reset`.
# project_id is a placeholder — rename per-developer if you run multiple
# local Supabase projects side by side.
project_id = "vecinoseguro"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enabled = true
double_confirm_changes = true
enable_confirmations = false

# Spanish (es-MX) transactional emails. The hosted project has its own copy:
# paste these into Authentication > Emails in the dashboard (see README).
[auth.email.template.confirmation]
subject = "Confirma tu cuenta de VecinoSeguro"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.invite]
subject = "Te invitaron a VecinoSeguro"
content_path = "./supabase/templates/invite.html"

[auth.email.template.recovery]
subject = "Restablece tu contraseña de VecinoSeguro"
content_path = "./supabase/templates/recovery.html"

[realtime]
enabled = true

[edge_runtime]
enabled = true

[analytics]
enabled = false
